<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d4b65">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <title>Betting model outputs</title>
  <style>
    :root{--ink:#172533;--muted:#607182;--line:#d6e0e8;--panel:#fff;--bg:#f3f6f8;--brand:#13627f;--brand-dark:#0d4b65;--soft:#e9f3f7;--gold:#fff7df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.shell{max-width:1440px;margin:auto;padding:20px}.top{display:flex;gap:16px;justify-content:space-between;align-items:end;margin:0 0 16px}.eyebrow{margin:0;color:var(--brand);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}h1{margin:2px 0 0;font-size:30px;line-height:1.1}.updated{margin:0;color:var(--muted);font-size:12px;text-align:right}.nav,.outputNav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}.nav{border-bottom:1px solid var(--line);margin-bottom:12px}.tab{appearance:none;border:1px solid #c5d4dd;background:#fff;border-radius:999px;color:#314454;cursor:pointer;font:inherit;font-size:14px;font-weight:750;padding:9px 14px;white-space:nowrap}.tab:hover{border-color:var(--brand)}.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}.outputNav{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:14px}.outputNav .tab{background:transparent;border-color:transparent;border-radius:8px}.outputNav .tab.active{background:#fff;color:var(--brand-dark);box-shadow:0 1px 3px #0d4b6526}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #1725330d;overflow:hidden}.head{align-items:center;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;padding:15px 18px}.head h2{font-size:18px;margin:0}.head p{color:var(--muted);font-size:13px;margin:2px 0 0}.open{background:var(--brand);border-radius:8px;color:white;display:inline-block;font-weight:750;padding:9px 12px;text-decoration:none;white-space:nowrap}.tableWrap{overflow:auto;max-height:calc(100vh - 245px)}table{border-collapse:collapse;font-size:13px;min-width:100%;white-space:nowrap}th,td{border-bottom:1px solid #e7edf1;padding:10px 12px;text-align:left}th{background:#f0f5f7;color:#405364;font-size:11px;position:sticky;text-transform:uppercase;top:0;z-index:1}td.team{background:#fffaf0;font-weight:700}.blank,.report{color:var(--muted);padding:32px;text-align:center}.mobile{display:none}.game{border-bottom:1px solid var(--line);padding:15px}.game:last-child{border:0}.game h3{font-size:17px;margin:0 0 3px}.game .date{color:var(--muted);font-size:13px;margin-bottom:12px}.metrics{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}.metric{background:#f6fafb;border:1px solid #e0e9ee;border-radius:8px;padding:9px}.metric span{color:var(--muted);display:block;font-size:10px;font-weight:850;text-transform:uppercase}.metric strong{font-size:17px}.detail{display:grid;gap:6px;margin-top:12px}.detail div{display:flex;gap:12px;justify-content:space-between}.detail span{color:var(--muted);font-size:12px}.detail b{text-align:right}.error{background:#fff1f0;border:1px solid #ffc7c3;border-radius:10px;color:#a7281d;margin:20px;padding:16px}.empty{padding:36px;color:var(--muted);text-align:center}@media(max-width:720px){.shell{padding:12px}.top{align-items:start;display:block}.updated{text-align:left;margin-top:8px}h1{font-size:26px}.nav{margin-left:-12px;margin-right:-12px;padding-left:12px}.outputNav{border-radius:10px;margin-bottom:10px}.head{align-items:start;padding:14px}.head h2{font-size:16px}.head .open{font-size:13px;padding:8px 10px}.tableWrap{display:none}.mobile{display:block}.metrics{grid-template-columns:1fr 1fr}.tab{font-size:13px;padding:8px 12px}.game{padding:14px}.detail b{font-size:13px;max-width:58%}}@media(min-width:721px){.mobile{display:none}}
    .filterBar{background:#f7fafb;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;padding:10px 18px;position:relative;z-index:3}.filterBar>div{align-items:center;display:flex;gap:8px}.filterBar span{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.miniTabs{display:flex;gap:5px;overflow-x:auto}.miniTabs button{background:#fff;border:1px solid #ccd9e1;border-radius:999px;color:#435563;cursor:pointer;font:inherit;font-size:12px;font-weight:700;padding:6px 10px;touch-action:manipulation;white-space:nowrap}.miniTabs button.active{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}@media(max-width:720px){.filterBar{align-items:stretch;display:grid;gap:10px;padding:10px 14px}.filterBar>div{align-items:start;display:grid;gap:5px}.miniTabs{padding-bottom:2px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><p class="eyebrow">Model review</p><h1>Betting outputs</h1></div><p class="updated" id="updated">Loading latest outputs…</p></header>
    <nav class="nav" id="sports" aria-label="Sports"></nav>
    <nav class="outputNav" id="outputs" aria-label="Sport outputs"></nav>
    <section class="panel" id="content" aria-live="polite"></section>
  </main>
  <script>
  (()=>{
    const base=location.pathname.startsWith('/ModelOutput/')?'/ModelOutput':'';
    const order=['NRL','NRLW','AFL','AFLW','NBL','WNBL','SSN','Super Rugby','Returns'];
    let data=[],sport='',file='',period='All',scenario='All';
    const norm=x=>String(x||'').toLowerCase().replace(/[_\s]+/g,' ').trim();
    const title=x=>String(x||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).replace(/\bNrlw?\b/gi,m=>m.toUpperCase()).replace(/\bAflw?\b/gi,m=>m.toUpperCase());
    const kind=o=>{const f=norm(o.file);if(f.includes('upcoming projections'))return'Projections';if(f.includes('anytime'))return'Try scorers';if(f.includes('try channel'))return'Try matchups';if(f.includes('futures'))return'Futures';if(f.includes('betting report'))return'Round summary';return title(o.model||o.file)};
    const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt=(v,c='')=>{if(v===null||v===undefined||v==='')return'—';if(/date/i.test(c)){const d=new Date(v);if(!Number.isNaN(d))return d.toLocaleDateString('en-AU',{day:'2-digit',month:'short'});}const n=Number(v);return Number.isFinite(n)&&String(v).length>5?n.toFixed(1).replace(/\.0$/,''):esc(v)};
    const find=(cols,names)=>cols.find(c=>names.includes(norm(c)))||'';
    const game=row=>{const cols=Object.keys(row),h=find(cols,['home team','home team name','home team']),a=find(cols,['away team','away team name','away team']);if(h&&a&&row[h]&&row[a])return `${title(row[h])} vs ${title(row[a])}`;const g=find(cols,['game']);return g&&row[g]?title(row[g]):title(row[find(cols,['team'])]||'Output');};
    const button=(label,active)=>`<button class="tab ${active?'active':''}" type="button" data-id="${esc(label)}">${esc(label)}</button>`;
    const periodLabel=value=>{const v=norm(value);if(v.includes('full')||v==='ft')return'FT';return String(value);};
    function render(){
      const sports=[...new Set(data.map(x=>x.sport))].sort((a,b)=>(order.indexOf(a)+99)%99-(order.indexOf(b)+99)%99);
      if(!sport||!sports.includes(sport))sport=sports.includes('NRL')?'NRL':sports[0];
      const list=data.filter(x=>x.sport===sport);if(!file||!list.some(x=>x.file===file)){file=(list.find(x=>kind(x)==='Projections')||list[0]||{}).file||'';}
      document.querySelector('#sports').innerHTML=sports.map(s=>button(s,s===sport)).join('');
      document.querySelector('#outputs').innerHTML=list.map(x=>button(kind(x),x.file===file)).join('');
      document.querySelectorAll('#sports button').forEach(b=>b.onclick=()=>{sport=b.dataset.id;file='';period='All';scenario='All';render();});
      document.querySelectorAll('#outputs button').forEach(b=>b.onclick=()=>{file=list.find(x=>kind(x)===b.dataset.id)?.file||file;period='All';scenario='All';render();});
      show(list.find(x=>x.file===file));
    }
    function show(out){
      const root=document.querySelector('#content');if(!out){root.innerHTML='<p class="empty">No published outputs for this sport.</p>';return;}
      const link=`${base}/files/${encodeURIComponent(out.file)}`+(out.fileUrl&&out.fileUrl.includes('?')?out.fileUrl.slice(out.fileUrl.indexOf('?')):'');
      const rows=Array.isArray(out.rows)?out.rows:[], cols=Array.isArray(out.columns)?out.columns:[];
      const periodCol=find(cols,['market period','market_period','period']), scenarioCol=find(cols,['projection type','projection_type','scenario']);
      const periodOptions=[...new Set(rows.map(r=>r[periodCol]).filter(v=>v!==undefined&&v!==null&&v!==''))];
      const scenarioOptions=[...new Set(rows.map(r=>r[scenarioCol]).filter(v=>v!==undefined&&v!==null&&v!==''))];
      const activeRows=rows.filter(r=>(period==='All'||String(r[periodCol])===period)&&(scenario==='All'||String(r[scenarioCol])===scenario));
      let head=`<div class="head"><div><h2>${esc(kind(out))}</h2><p>${activeRows.length?`${activeRows.length} rows`:out.extension==='html'?'Rendered report':'No rows'} · ${esc(out.modified||'')}</p></div><a class="open" href="${link}" target="_blank" rel="noreferrer">Open source</a></div>`;
      if(out.extension==='html'){root.innerHTML=head+'<div class="report">Open the round summary to view the full report.</div>';return;}
      if(!rows.length){root.innerHTML=head+'<div class="empty">No rows were published for this output.</div>';return;}
      const secondary=(periodOptions.length>1||scenarioOptions.length>1)?`<div class="filterBar">${periodOptions.length>1?`<div><span>Market</span><div class="miniTabs"><button class="${period==='All'?'active':''}" data-filter="period" data-value="All">All</button>${periodOptions.map(v=>`<button class="${period===String(v)?'active':''}" data-filter="period" data-value="${esc(v)}">${esc(periodLabel(v))}</button>`).join('')}</div></div>`:''}${scenarioOptions.length>1?`<div><span>Scenario</span><div class="miniTabs"><button class="${scenario==='All'?'active':''}" data-filter="scenario" data-value="All">All</button>${scenarioOptions.map(v=>`<button class="${scenario===String(v)?'active':''}" data-filter="scenario" data-value="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`:''}</div>`:'';
      const isTryScorers=norm(out.file).includes('nrl anytime tryscorers');
      const priority=isTryScorers?['game','team','player','price']:['date','time','home team','away team','selected / hybrid home line','team home line','player home line','projected total','market line','market total'];
      const visible=[...priority.map(p=>find(cols,[p])).filter(Boolean),...cols.filter(c=>!priority.includes(norm(c)))];
      const table='<div class="tableWrap"><table><thead><tr>'+visible.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr></thead><tbody>'+activeRows.map(r=>'<tr>'+visible.map(c=>`<td class="${/team/i.test(c)?'team':''}">${fmt(r[c],c)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>';
      const metricCols=(isTryScorers?['price']:['selected / hybrid home line','team home line','player home line','projected total']).map(p=>find(cols,[p])).filter(Boolean);
      const mobile='<div class="mobile">'+activeRows.map(r=>{const date=find(cols,['date']),time=find(cols,['time']);const rest=visible.filter(c=>!metricCols.includes(c)&&!['date','time','game','home team','away team'].includes(norm(c)));return `<article class="game"><h3>${esc(game(r))}</h3>${isTryScorers?'':`<div class="date">${fmt(r[date],date)} ${fmt(r[time],time)}</div>`}<div class="metrics">${metricCols.map(c=>`<div class="metric"><span>${esc(c)}</span><strong>${fmt(r[c],c)}</strong></div>`).join('')}</div><div class="detail">${rest.map(c=>`<div><span>${esc(c)}</span><b>${fmt(r[c],c)}</b></div>`).join('')}</div></article>`}).join('')+'</div>';
      root.innerHTML=head+secondary+(activeRows.length?mobile+table:'<div class="empty">No rows match these options.</div>');
      // Delegation is deliberate: the desktop table has sticky headers and is
      // rebuilt after every selection.  A single panel handler remains active
      // across both table and mobile-card layouts.
      root.onclick=event=>{
        const button=event.target.closest('button[data-filter]');
        if(!button||!root.contains(button))return;
        event.preventDefault();
        if(button.dataset.filter==='period')period=button.dataset.value;else scenario=button.dataset.value;
        show(out);
      };
    }
    fetch(`${base}/data/outputs.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>r.json()).then(x=>{data=x.outputs||[];document.querySelector('#updated').textContent=`Updated ${x.generatedAt||''}`;render();}).catch(e=>{document.querySelector('#content').innerHTML=`<div class="error">Could not load the published output index: ${esc(e.message)}</div>`;});
  })();
  </script>
</body>
</html>
